<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Third Level | Master CBSE Presentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070709; color: #fdfbf7; overflow: hidden; height: 100vh; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-vintage { font-family: 'Special Elite', cursive; }
        
        .glass-card {
            background: rgba(18, 18, 24, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 20px 50px rgba(0,0,0,0.85);
        }

        .slide {
            position: absolute;
            inset: 0;
            display: none;
            opacity: 0;
            transform: scale(0.98);
            transition: all 0.3s ease-out;
        }
        .slide.active {
            display: flex !important;
            opacity: 1;
            transform: scale(1);
        }

        /* Flip Card Styling */
        .perspective { perspective: 1000px; }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .perspective:hover .flip-card-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back {
            position: absolute;
            inset: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .flip-back { transform: rotateY(180deg); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 3px; }
    </style>
</head>
<body class="flex flex-col justify-between h-screen select-none">

    <!-- Top Header Navigation -->
    <header class="h-16 px-6 bg-black/90 backdrop-blur-md border-b border-amber-500/30 flex items-center justify-between z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500/20 to-amber-600/10 border border-amber-500/50 flex items-center justify-center text-amber-400 font-cinzel font-black shadow-lg">3L</div>
            <div>
                <h1 class="font-cinzel text-amber-400 font-bold tracking-widest text-sm md:text-base">THE THIRD LEVEL</h1>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">Jack Finney • CBSE Class 12 Vistas Masterclass[cite: 1]</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleNotes()" class="px-3 py-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-semibold flex items-center gap-1.5 transition">
                <span>📖 Teacher Notes</span>
            </button>
            <span id="slide-counter" class="font-cinzel text-xs text-amber-300 bg-amber-500/10 px-3 py-1.5 rounded-full border border-amber-500/30">Slide 1 of 15</span>
            <button onclick="toggleGrid()" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 hover:text-amber-400 text-xs font-semibold transition" title="Slide Overview (Press G)">
                ❖ Grid
            </button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main class="relative flex-1 overflow-hidden flex items-center justify-center p-4 md:p-8">

        <!-- SLIDE 1: Title Slide -->
        <div class="slide active flex-col justify-between p-8 md:p-12 rounded-2xl max-w-6xl w-full h-[80vh] bg-cover bg-center relative overflow-hidden" style="background-image: linear-gradient(to bottom, rgba(7,7,9,0.85), rgba(7,7,9,0.96)), url('https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?q=80&w=1920&auto=format&fit=crop');" data-notes="Introduction to Jack Finney's classic tale blending reality and fantasy[cite: 1]. Emphasize how modern anxiety drives psychological escapism[cite: 1].">
            <div class="relative z-10 flex flex-col items-center text-center my-auto">
                <span class="text-amber-400 font-cinzel tracking-[0.3em] text-xs uppercase mb-4 px-4 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30">CBSE Class 12 English Vistas[cite: 1]</span>
                <h2 class="font-cinzel text-4xl md:text-6xl font-black text-white tracking-wide mb-4 shadow-xl">The Third Level</h2>
                <p class="text-lg md:text-xl text-amber-200/90 font-light max-w-2xl mb-8">The psychological junction between modern stress and historical serenity[cite: 1].</p>
